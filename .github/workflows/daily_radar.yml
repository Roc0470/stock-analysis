name: A-Share Daily Quant Radar

on:
  push:
    branches: [ main ]
  schedule:
    # 国际标准时间 (UTC) 对应 北京时间 (UTC+8):
    # UTC 01:15 -> 北京时间 09:15 (周一至周五 盘前筛选)
    - cron: '15 1 * * 1-5'
    # UTC 06:30 -> 北京时间 14:30 (周一至周五 尾盘低吸黄金窗口)
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 支持在手机或网页随时点击手动运行

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装量化依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 A股短线量化严选模型
        run: |
          python main.py --no-open

      - name: 准备 GitHub Pages 网页发布
        run: |
          mkdir -p public
          cp reports/daily_report.html public/index.html

      - name: 自动部署到 GitHub Pages 在线网页 (手机随时随地看)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
